# Render Blueprint for the Gas Cylinder Tracking System.
#
# One web service (the Fastify API, which also serves the Expo web build at /app) and
# one PostgreSQL database. Deploy it from the Render dashboard: New > Blueprint, point
# it at this repository, then fill in the three secrets marked `sync: false` below.
#
# ## Why the free plan works here without losing evidence
#
# A free Render web service has an EPHEMERAL disk: it is wiped every time the instance
# spins down, which it does after fifteen idle minutes. Photographs, signatures and
# delivery notes written to it would vanish while the database kept referencing them.
# `STORAGE_DRIVER=db` puts those bytes in Postgres instead, so the free plan loses
# nothing. See apps/api/src/services/storage.ts.
#
# What the free plan DOES cost you: the first request after an idle period waits
# ~30-60s for the instance to wake, and a free database is removed after 30 days.
# For anything beyond a demo, move the web service to `starter` and the database to a
# paid plan; nothing else here changes.

databases:
  - name: gct-db
    databaseName: gct
    user: gct
    plan: free
    # Frankfurt is the closest Render region to South Africa; it must match the
    # service's region below or they cannot talk over the private network.
    region: frankfurt

services:
  - type: web
    name: gct
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: ./scripts/render-build.sh
    startCommand: ./scripts/render-start.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: gct-db
          property: connectionString

      # Signs access tokens. Generated by Render and never seen by anyone.
      - key: JWT_ACCESS_SECRET
        generateValue: true

      # Blobs go in Postgres, because this instance's disk does not survive a restart.
      - key: STORAGE_DRIVER
        value: db

      # Serves the Expo web export at /app from this same origin, which is what lets
      # the browser bundle call the API without CORS and without a baked-in hostname.
      # Relative to apps/api, because npm runs a workspace script from its own folder.
      - key: SERVE_WEB_APP
        value: ../mobile/dist-web

      - key: SERIAL_YEAR_TZ
        value: Africa/Johannesburg

      # ---- fill these in, in the Render dashboard ----

      # The QR signing keypair. A LABEL IS ONLY VALID UNDER THE KEY THAT MINTED IT, so
      # generate one pair and keep it: change these and every label already stuck on a
      # cylinder stops verifying. `npm run gen-qr-keys` prints a fresh pair; or copy
      # the pair out of your local apps/api/.env to keep existing labels working.
      #
      # The web build's EXPO_PUBLIC_QR_VERIFY_PUBLIC_KEY is derived from the public
      # half at build time (scripts/render-build.sh) rather than set separately, so
      # the two cannot drift apart and start rejecting every scan.
      - key: QR_SIGN_PRIVATE_KEY_HEX
        sync: false
      - key: QR_SIGN_PUBLIC_KEY_HEX
        sync: false

      # Real email through Resend. Create a key at resend.com.
      #
      # With no verified domain, MAIL_FROM must be "onboarding@resend.dev" and Resend
      # delivers ONLY to the address that owns the account - everything else is
      # refused with a 403 and left PENDING in the queue. Verify a domain at
      # resend.com/domains to send to anyone, then point MAIL_FROM at it.
      #
      # BOTH ARE REQUIRED TO BOOT. MAILER=resend without a key fails env validation at
      # startup rather than at the first send, which is deliberate — see apps/api/src/
      # env.ts. If Resend is not ready yet, set MAILER=mailhog and leave the key empty:
      # everything works except sending, and it is one variable to switch back.
      - key: MAILER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
