# Postgres, and nothing else. Mail used to have a MailHog container here; it was a
# sink that spoke real SMTP and delivered nothing, which meant a `MAILER` value that
# looked configured and quietly dropped every QR sheet. Mail now goes through Resend,
# and the test suite uses an in-process capture transport that needs no container.
services:
  db:
    image: postgres:16-alpine
    container_name: gct-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gct
      POSTGRES_PASSWORD: gct
      POSTGRES_DB: gct
    ports:
      - '5432:5432'
    volumes:
      - gct-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gct -d gct']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gct-db-data:
